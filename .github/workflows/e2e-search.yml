name: "E2E: Map search"

on:
  push:
    paths:
      - 'apps/website/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/website/**'
      - '.github/workflows/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "NOTE: package-lock / reproducible installs"
        run: |
          echo "NOTICE: This workflow uses 'npm install' to ensure devDependencies like Playwright are available even when package-lock.json is out of sync."
          echo "Recommended: Locally run 'npm install' in apps/website and commit the updated package-lock.json, then change this workflow to use 'npm ci' for deterministic installs."

      - name: Create dev env file for compose
        run: cp apps/api/.env.development.example apps/api/.env.development

      - name: Bring up services with docker compose (dev)
        run: |
          docker compose -f docker-compose-dev.yml --env-file apps/api/.env.development up -d --build

      - name: Wait for website to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "website is up"
              break
            fi
            echo "waiting for website..."
            sleep 2
          done

      - name: Install Playwright and browsers
        working-directory: apps/website
        run: |
          # Clean up node_modules from docker build (may have root-owned files)
          rm -rf node_modules package-lock.json
          # Use npm install here to avoid failing when package-lock.json is out of sync with package.json
          npm install --no-audit --no-fund
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/website
        run: npx playwright test --config=playwright.config.ts
