name: "E2E: Map search"

on:
  push:
    paths:
      - 'apps/website/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/website/**'
      - '.github/workflows/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js LTS
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: "NOTE: package-lock / reproducible installs"
        run: |
          echo "NOTICE: This workflow uses 'npm install' to ensure devDependencies like Playwright are available even when package-lock.json is out of sync."
          echo "Recommended: Locally run 'npm install' in apps/website and commit the updated package-lock.json, then change this workflow to use 'npm ci' for deterministic installs."

      - name: Create dev env file for compose
        run: cp apps/api/.env.development.example apps/api/.env.development

      - name: Bring up services with docker compose (dev)
        run: |
          docker compose -f docker-compose-dev.yml --env-file apps/api/.env.development up -d --build

      - name: Wait for website to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:3000 >/dev/null; then
              echo "website is up"
              break
            fi
            echo "waiting for website..."
            sleep 2
          done

      - name: "Test: Check page title after 20 seconds"
        run: |
          echo "Waiting 20 seconds for website to fully render..."
          sleep 20
          echo "Checking for expected title in first 10 lines..."
          curl -sSf http://localhost:3000 | head -n 10 | grep -q '<title>AirGradient Global Air Quality Map</title>'
          if [ $? -eq 0 ]; then
            echo "✓ Found expected title in page"
          else
            echo "✗ Title not found in first 10 lines"
            echo "First 20 lines of page:"
            curl -sSf http://localhost:3000 | head -n 20
            exit 1
          fi

      - name: Fix file permissions for website directory
        run: |
          echo "Fixing permissions for apps/website to avoid root-owned build artifacts..."
          # change ownership to the current runner UID/GID so npm can write files
          sudo chown -R $(id -u):$(id -g) ./apps/website || true

      - name: Install Playwright and browsers
        working-directory: apps/website
        run: |
          # Clean up node_modules from docker build (may have root-owned files)
          rm -rf node_modules package-lock.json
          # Use npm install here to avoid failing when package-lock.json is out of sync with package.json
          npm install --no-audit --no-fund
          npx playwright install --with-deps

      - name: "Debug: show docker compose status and recent logs"
        run: |
          echo "---- docker compose ps ----"
          docker compose -f docker-compose-dev.yml ps || true
          echo "---- recent website logs (last 200 lines) ----"
          docker compose -f docker-compose-dev.yml logs --tail=200 app || true
          echo "---- all service logs (last 200 lines) ----"
          docker compose -f docker-compose-dev.yml logs --tail=200 || true

      - name: Run Playwright tests
        working-directory: apps/website
        run: npx playwright test --config=playwright.config.ts
